
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Diwali Surprise ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="diya-icon">🪔</div>

            <p class="welcome-text">A little surprise awaits you</p>

            <h1>Someone Special ❤️</h1>

            <p class="subtitle">
                This little celebration is just for you.
                Enter your details to unlock it.
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p id="errorMessage" class="error-message" aria-live="polite"></p>

                <button type="submit" id="loginButton">
                    Unlock Your Surprise ✨
                </button>

            </form>

            <p class="bottom-text">
                Made with love, just for you ❤️
            </p>

        </div>

    </main>

</body>
</html>
