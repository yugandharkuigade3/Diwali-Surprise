<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080f20">
    <title>A Little More Patience ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="timer.css">
    <script src="timer.js" defer></script>
</head>
<body>
    <main class="timer-container">
        <section class="timer-card" aria-labelledby="timerTitle">
            <div class="timer-diya" aria-hidden="true">🪔</div>
            <p class="timer-eyebrow">A little surprise is waiting</p>
            <h1 id="timerTitle">The celebration begins soon ❤️</h1>
            <p class="timer-message">
                Some moments are worth waiting for.
                Come back when the clock strikes midnight.
            </p>

            <div class="countdown" aria-label="Time remaining">
                <div class="time-unit">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>
                <span class="time-separator">:</span>
                <div class="time-unit">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>
                <span class="time-separator">:</span>
                <div class="time-unit">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>
            </div>

            <p class="timer-footer">Until 12:00 AM ✨</p>
            <p class="timer-signature">Made with love, just for you ❤️</p>
        </section>
    </main>
</body>
</html>
